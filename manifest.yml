name: "BioPB"
category: "Interactive Apps"
subcategory: "Bioimage Analysis"
role: "batch_connect"
icon: "fa://microscope"
description: |
  Agentic bio-image analysis on the cluster: work with microscopy data where it
  is stored, from notebooks or with an AI agent, and browse and view it in your
  web browser.

  Starts the BioPB stack on a compute node: a dashboard and data browser, an
  Arrow Flight data plane, and a session (a Python kernel with the data client and
  image-processing operations) that notebooks and agents share. Optionally also
  JupyterLab. The data plane reads formats including OME-Zarr, OME-TIFF, CZI,
  ND2, LIF, NDTiff, DICOM and NIfTI directly from disk and serves them as
  multi-resolution pyramids, so whole-slide and larger-than-memory datasets need
  no staging or import step.

  The web UI is served through the portal itself: the session card has a Connect
  button and there is no tunnel to run. The Arrow Flight data plane, for SDK and
  napari clients, is published on the compute node over TLS by default — the card
  gives you the endpoint and the certificate fingerprint. A launch-form field
  keeps it on loopback behind an SSH tunnel instead.
